<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia dos leads — Operação Moisés</title><link rel="stylesheet" href="../meta-leads.css"><style>:root{--ink:#f7f1fa;--line:#ffffff24;--card:#21162b}body{margin:0;background:#100c15;color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:36px;letter-spacing:-.04em;margin-bottom:6px}.preview-note{color:#c3b4cb}select{padding:8px;background:#21162b;color:white;border-radius:10px}</style></head><body><main><h1>Da conversa à venda</h1><p class="preview-note">Prévia de layout com dados fictícios. Vendas, metas e acessos existentes permanecem no painel atual.</p><label>Período <select id="monthSelector"><option value="2026-10">Outubro 2026</option><option value="2026-09">Setembro 2026</option></select></label><section id="anchor"></section></main><script src="../meta-leads.js"></script><script>
const ops=[['jaragua','Jaraguá + Joinville'],['porto','Porto'],['beira-rio','Beira Rio'],['floripa','Floripa']];
const leads=[],sales=[];for(const [id] of ops)for(let day=19;day<=26;day++){leads.push({workspace_id:id,record_date:'2026-10-'+day,leads:day===26?4:100,meta_spend:day===26?40:900,is_partial:day===26,source:'meta_messaging_conversation_started_7d',synced_at:'2026-10-26T08:00:00-03:00'});if(day<=24)sales.push({workspace_id:id,record_date:'2026-10-'+day,orders:8})}
window.MoisesWorkspace={memberships:async()=>ops.map(([workspace_id,name])=>({workspace_id,role:'admin',workspace:{slug:workspace_id,name}})),choose:items=>items[0],workspaceOf:m=>m.workspace};
const makeQuery=table=>{const q={select:()=>q,in:()=>q,gte:()=>q,lte:()=>q,order:()=>q,limit:()=>Promise.resolve({data:table==='moises_meta_leads_daily'?leads:sales,error:null})};return q};
const channel={on(){return this},subscribe(){return this}};
const db={auth:{getSession:async()=>({data:{session:{user:{id:'preview'}}}})},from:makeQuery,channel:()=>channel};
MoisesLeads.mount({db,group:true,anchor:'#anchor'});
</script></body></html>
