<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Operação Moisés — Escolher loja</title>
  <style>
    :root{--ink:#f7f1fa;--muted:#b9aabd;--line:#ffffff17;--panel:#211528;--bg:#110b16}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 80% 8%,#6d2ccf33,transparent 28%),radial-gradient(circle at 8% 88%,#d4af3724,transparent 30%),var(--bg)}
    body.auth-pending{visibility:hidden}.shell{width:min(1180px,calc(100% - 36px));margin:auto;padding:42px 0 60px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:34px}.brand small{color:#d2bfd7;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.brand h1{margin:8px 0 7px;font-size:clamp(34px,5vw,64px);line-height:.95;letter-spacing:-.055em}.brand p{margin:0;color:var(--muted)}.actions{display:flex;gap:10px;align-items:center}.actions button{border:1px solid var(--line);border-radius:12px;padding:11px 15px;background:#ffffff0b;color:#fff;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.store{--accent:#f4589b;--secondary:#6d2ccf;position:relative;min-height:310px;overflow:hidden;padding:28px;border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:28px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 13%,#211528),#1a111f 68%);box-shadow:0 24px 70px #0005;isolation:isolate}.store:before{content:"";position:absolute;width:260px;height:260px;right:-75px;top:-110px;border-radius:50%;background:var(--accent);filter:blur(75px);opacity:.22;z-index:-1}.store-number{font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}.store h2{max-width:520px;margin:16px 0 10px;font-size:clamp(30px,4vw,48px);line-height:1;letter-spacing:-.045em}.store p{max-width:500px;margin:0;color:#cbbfd0;line-height:1.55}.status{display:inline-flex;align-items:center;gap:7px;margin-top:24px;color:#dfd5e2;font-size:12px;font-weight:800}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}.buttons{position:absolute;left:28px;right:28px;bottom:26px;display:flex;gap:9px;flex-wrap:wrap}.buttons a{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:10px 15px;border:1px solid #ffffff1f;border-radius:12px;color:#fff;text-decoration:none;font-size:12px;font-weight:900;background:#ffffff0b}.buttons a.primary{color:#181018;border-color:transparent;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 72%,white))}.empty{grid-column:1/-1;padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:24px}.foot{margin-top:22px;color:#807386;font-size:11px;text-align:center}
    @media(max-width:760px){.shell{width:min(100% - 20px,1180px);padding-top:24px}.top{align-items:flex-start}.grid{grid-template-columns:1fr}.store{min-height:330px;padding:23px}.buttons{left:23px;right:23px}.brand p{max-width:250px}.actions button{padding:10px 12px}}
  </style>
</head>
<body class="auth-pending">
  <main class="shell">
    <header class="top"><div class="brand"><small>Operação Moisés</small><h1>Escolha a loja</h1><p>Um acesso. Todas as operações.</p></div><div class="actions"><button id="logout" type="button">Sair</button></div></header>
    <section class="grid" id="stores"><div class="empty">Carregando suas operações…</div></section>
    <div class="foot" id="account"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0/dist/umd/supabase.min.js"></script><script src="./workspace.js"></script>
  <script>
    const db=window.supabase.createClient('https://nubzdbalhhqgrwjyjord.supabase.co','sb_publishable_TG0W0Ih25aHB2A7u0Tkdig_l6R168sd');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function boot(){
      const {data:{session}}=await db.auth.getSession();if(!session){location.replace('./index.html');return}
      let memberships=[];try{memberships=await MoisesWorkspace.memberships(db,session.user.id)}catch(e){}
      if(!memberships.length){await db.auth.signOut();location.replace('./index.html');return}
      document.getElementById('account').textContent=session.user.email;
      document.getElementById('stores').innerHTML=memberships.map((m,i)=>{const w=MoisesWorkspace.workspaceOf(m),id=encodeURIComponent(m.workspace_id),accent=esc(w.accent_color||'#f4589b'),secondary=esc(w.secondary_color||'#6d2ccf'),main=MoisesWorkspace.routeFor(m.role),strategy=w.slug==='porto'?`<a href="./estrategia.html?workspace=${id}">Apresentação inicial</a>`:'';return `<article class="store" style="--accent:${accent};--secondary:${secondary}"><div class="store-number">Operação ${String(i+1).padStart(2,'0')}</div><h2>${esc(w.brand_name||w.name)}</h2><p>${esc(w.description||'Painel de desempenho e estratégia da operação.')}</p><span class="status">Projeto independente</span><div class="buttons"><a class="primary" href="./${main}?workspace=${id}">Abrir painel</a>${m.role!=='traffic_manager'?`<a href="./apresentacao.html?workspace=${id}">Visão executiva</a>`:''}${strategy}</div></article>`}).join('');
      document.body.classList.remove('auth-pending');
    }
    document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.replace('./index.html')};db.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'||!s)location.replace('./index.html')});boot();
  </script>
</body></html>
